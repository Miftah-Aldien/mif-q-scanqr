name: Build APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Prepare icon
        run: |
          mkdir -p resources
          if [ -f "www/icon.png" ]; then cp www/icon.png resources/icon.png; fi
          if [ -f "icon.png" ]; then cp icon.png resources/icon.png; fi
          if [ -f "www/splash.png" ]; then cp www/splash.png resources/splash.png; fi
          ls -l resources/ || true

      - name: Add Android platform
        run: npx cap add android || true

      - name: Generate icons and splash
        run: |
          npm install @capacitor/assets --save-dev || npm install @capacitor/assets
          npx @capacitor/assets generate --android || echo "assets generate skipped"

      - name: Add Camera permission
        run: |
          python3 - << 'PY'
          import pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          t = p.read_text()
          perms = [
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />',
              '<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />',
              '<uses-feature android:name="android.hardware.camera" android:required="false" />',
          ]
          for perm in perms:
              if perm not in t:
                  # insert right after <manifest ...> line
                  idx = t.find(">")
                  t = t[:idx+1] + "\n    " + perm + t[idx+1:]
          p.write_text(t)
          print(p.read_text())
          PY

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
